name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov ruff python-dotenv

      - name: Lint
        run: ruff check .

      - name: Run tests with coverage
        run: pytest -q --cov=src/server --cov-report=term-missing --cov-fail-under=70

      - name: Bytecode sanity
        run: python -m compileall src

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t keep-mcp .

      - name: Run container
        run: docker run -d --name keep-mcp-test -p 8000:8000 keep-mcp

      - name: Check container answers on /mcp
        run: |
          for i in {1..30}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/mcp || true)
            if [ "$status" != "000" ] && [ -n "$status" ]; then
              echo "Container answered on /mcp with HTTP $status"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to respond on /mcp within 30s"
          docker logs keep-mcp-test
          exit 1
